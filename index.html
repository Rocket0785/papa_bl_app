<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundesliga Tippschein</title>
<style>
  :root { --red:#d20515; --ink:#1a1a1a; --mute:#6b7280; --line:#e5e7eb; --bg:#eef0f3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Inter,Roboto,sans-serif; background:var(--bg); color:var(--ink); padding:20px 12px 40px; }
  .tools { max-width:460px; margin:0 auto 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tools button, .tools select, .tools input { font:inherit; font-size:14px; padding:8px 12px; border:1px solid #cbd0d8; border-radius:8px; background:#fff; cursor:pointer; }
  .tools input { cursor:text; width:78px; }
  .tools button:hover { background:#f3f4f6; }
  .tools .hint { flex-basis:100%; font-size:12px; color:var(--mute); }
  .tools .hint.err { color:#b45309; }

  #card { max-width:460px; margin:0 auto; background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.12); }
  .head { background:linear-gradient(135deg,#d20515,#8f0310); color:#fff; padding:16px 20px; }
  .head .top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .head .profile-pic { width:60px; height:60px; border-radius:50%; object-fit:cover; flex:none; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .head .profile-info { flex:1; }
  .head .person-name { font-weight:700; font-size:16px; margin:0 0 2px; }
  .head .title { width:100%; background:transparent; border:0; border-bottom:1px dashed rgba(255,255,255,.35); color:#fff; font-weight:700; font-size:22px; font-family:inherit; padding:0 0 4px; outline:none; }
  .head .title::placeholder { color:rgba(255,255,255,.7); }
  .head .sub { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:14px; opacity:.95; gap:10px; }
  .head .sub input { background:transparent; border:0; border-bottom:1px dashed rgba(255,255,255,.35); color:#fff; font-weight:600; font-size:15px; font-family:inherit; width:150px; padding:0 0 2px; outline:none; text-align:right; }
  .head .sub input::placeholder { color:rgba(255,255,255,.65); }
  .day { font-weight:700; font-size:16px; }

  .match { padding:10px 14px 12px; border-bottom:1px solid var(--line); }
  .match:last-child { border-bottom:0; }
  .time { text-align:center; font-size:11px; letter-spacing:.04em; color:var(--mute); text-transform:uppercase; height:14px; margin-bottom:4px; }
  .row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
  .team { display:flex; align-items:center; gap:10px; min-width:0; }
  .team.away { justify-content:flex-end; }
  .team img, .team svg.badge { width:40px; height:40px; flex:none; object-fit:contain; }
  .abbr { font-weight:800; font-size:18px; letter-spacing:.02em; }
  .score { display:flex; align-items:center; gap:6px; font-weight:700; color:var(--mute); }
  .score input { width:46px; height:46px; text-align:center; font-weight:700; font-size:22px; font-family:inherit; border:2px solid #d1d5db; border-radius:10px; background:#f9fafb; color:var(--ink); outline:none; padding:0; }
  .score input:focus { border-color:var(--red); background:#fff; }
  .score input.filled { border-color:#16a34a; background:#f0fdf4; }
  .sel { display:none; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  body.edit .sel { display:grid; }
  .sel select { font:inherit; font-size:13px; padding:6px; border:1px solid #cbd0d8; border-radius:6px; width:100%; }
  .foot { text-align:center; font-size:11px; color:var(--mute); padding:8px 0 12px; }
  body.shot .tools, body.shot .sel { display:none !important; }
  body.shot { padding-top:12px; }
  @media (max-width:400px) { .abbr { font-size:16px; } .team img, .team svg.badge { width:32px; height:32px; } .score input { width:40px; height:42px; } }
</style>
</head>
<body>

<div class="tools" id="tools">
  <button id="loadBtn" title="Paarungen automatisch laden (OpenLigaDB)">Spieltag laden</button>
  <input id="dayIn" type="number" min="1" max="34" placeholder="Nr.">
  <button id="editBtn">Paarungen ändern</button>
  <button id="clearBtn">Tipps löschen</button>
  <button id="shotBtn">Screenshot-Ansicht</button>
  <div class="hint" id="hint">Tipps eintragen, dann „Screenshot-Ansicht“ klicken und Bildschirmfoto machen (Mac: Cmd+Shift+4).</div>
</div>

<script>
// abbr, name, alias (lowercase part of the OpenLigaDB name), bg, fg
const TEAMS = [
  ["FCB","FC Bayern München","bayern","#dc052d","#fff"],
  ["BVB","Borussia Dortmund","dortmund","#fde100","#111"],
  ["RBL","RB Leipzig","leipzig","#dd0741","#fff"],
  ["B04","Bayer 04 Leverkusen","leverkusen","#e32221","#111"],
  ["SGE","Eintracht Frankfurt","frankfurt","#e1000f","#111"],
  ["VFB","VfB Stuttgart","stuttgart","#ffffff","#e32219"],
  ["SCF","SC Freiburg","freiburg","#111","#fff"],
  ["TSG","TSG Hoffenheim","hoffenheim","#1961b5","#fff"],
  ["BMG","Borussia Mönchengladbach","gladbach","#0c7a3d","#fff"],
  ["WOB","VfL Wolfsburg","wolfsburg","#65b32e","#fff"],
  ["SVW","Werder Bremen","bremen","#1d9053","#fff"],
  ["M05","1. FSV Mainz 05","mainz","#c3141e","#fff"],
  ["FCA","FC Augsburg","augsburg","#ba3733","#fff"],
  ["FCU","1. FC Union Berlin","union","#eb1923","#fff"],
  ["FCH","1. FC Heidenheim","heidenheim","#e2001a","#1c3e8a"],
  ["STP","FC St. Pauli","pauli","#6b3a1f","#fff"],
  ["KOE","1. FC Köln","köln","#ed1c24","#fff"],
  ["HSV","Hamburger SV","hamburger","#005ba1","#fff"],
  ["S04","FC Schalke 04","schalke","#004d9d","#fff"],
  ["BSC","Hertha BSC","hertha","#005ca9","#fff"],
  ["SVE","SV Elversberg","elversberg","#111","#fff"],
  ["SCP","SC Paderborn 07","paderborn","#0060a9","#111"],
  ["F95","Fortuna Düsseldorf","düsseldorf","#e2001a","#fff"],
  ["H96","Hannover 96","hannover","#00a650","#111"],
  ["FCK","1. FC Kaiserslautern","kaiserslautern","#d4011d","#fff"],
  ["FCN","1. FC Nürnberg","nürnberg","#a50034","#111"],
  ["KSC","Karlsruher SC","karlsruher","#0057a8","#fff"],
  ["D98","SV Darmstadt 98","darmstadt","#005ca9","#fff"],
  ["BOC","VfL Bochum","bochum","#005ca9","#fff"],
  ["SGF","SpVgg Greuther Fürth","fürth","#009a44","#fff"]
].map(([abbr,name,alias,bg,fg]) => ({abbr,name,alias,bg,fg}));

const KEY = "tippschein-bl-v1";
const $ = id => document.getElementById(id);
const now = new Date();
const state = Object.assign({
  title: "", tipper: "", day: null,
  season: now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1,
  matches: [], tips: {}
}, JSON.parse(localStorage.getItem(KEY) || "{}"));
const save = () => localStorage.setItem(KEY, JSON.stringify(state));

const norm = s => (s || "").toLowerCase();
const findTeam = n => TEAMS.find(t => norm(n).includes(t.alias)) ;
const teamFromApi = (name, icon) => {
  const t = findTeam(name);
  return { abbr: t ? t.abbr : (name||"").replace(/[^A-Za-zÄÖÜäöü0-9]/g,"").slice(0,3).toUpperCase(), name, icon: icon || "" };
};
const teamFromList = abbr => { const t = TEAMS.find(x => x.abbr === abbr); return { abbr:t.abbr, name:t.name, icon:"" }; };

const EMBEDDED_LOGOS = {};

function badge(abbr) {
  const t = TEAMS.find(x => x.abbr === abbr) || { bg:"#374151", fg:"#fff" };
  const fs = abbr.length > 3 ? 20 : 24;
  return `<svg class="badge" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 8h80v46c0 22-18 34-40 40C28 88 10 76 10 54z" fill="${t.bg}" stroke="rgba(0,0,0,.25)" stroke-width="3"/><text x="50" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="${fs}" fill="${t.fg}">${abbr}</text></svg>`;
}
function logo(team) {
  const holder = document.createElement("span");
  const src = EMBEDDED_LOGOS[team.abbr] || team.icon;
  if (src) {
    holder.innerHTML = `<img src="${src}" alt="${team.abbr}">`;
    const img = holder.firstChild;
    img.onerror = () => { img.outerHTML = badge(team.abbr); };
    return img;
  }
  holder.innerHTML = badge(team.abbr);
  return holder.firstChild;
}

const dayKey = () => `${state.season}-${state.day || "x"}`;
const tipsNow = () => (state.tips[dayKey()] = state.tips[dayKey()] || {});

function render() {
  $("title").value = state.title;
  $("dayIn").value = state.day || "";
  $("dayLbl").textContent = state.day ? `${state.day}. Spieltag · Bundesliga` : "Bundesliga";
  $("foot").textContent = `Saison ${state.season}/${String(state.season + 1).slice(2)}`;
  const box = $("matches"); box.innerHTML = "";
  const tips = tipsNow();
  state.matches.forEach((m, i) => {
    const el = document.createElement("div"); el.className = "match";
    const tm = m.t ? new Date(m.t).toLocaleString("de-DE", { weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "";
    el.innerHTML = `<div class="time">${tm}</div>
      <div class="row">
        <div class="team home"><span class="lg"></span><span class="abbr">${m.h.abbr}</span></div>
        <div class="score"><input inputmode="numeric" maxlength="2" aria-label="Tore ${m.h.abbr}"><span>:</span><input inputmode="numeric" maxlength="2" aria-label="Tore ${m.a.abbr}"></div>
        <div class="team away"><span class="abbr">${m.a.abbr}</span><span class="lg"></span></div>
      </div>
      <div class="sel"><select></select><select></select></div>`;
    el.querySelector(".team.home .lg").replaceWith(logo(m.h));
    el.querySelector(".team.away .lg").replaceWith(logo(m.a));
    const [hi, ai] = el.querySelectorAll(".score input");
    const cur = tips[i] || ["", ""];
    hi.value = cur[0]; ai.value = cur[1];
    [hi, ai].forEach((inp, k) => {
      const mark = () => inp.classList.toggle("filled", inp.value !== "");
      mark();
      inp.addEventListener("input", () => {
        inp.value = inp.value.replace(/\D/g, "").slice(0, 2); mark();
        const t = tipsNow(); t[i] = [hi.value, ai.value]; save();
      });
      inp.addEventListener("focus", () => inp.select());
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") { const all = [...document.querySelectorAll(".score input")]; (all[all.indexOf(inp) + 1] || inp).focus(); }
      });
    });
    const sels = el.querySelectorAll(".sel select");
    [["h", sels[0]], ["a", sels[1]]].forEach(([side, sel]) => {
      sel.innerHTML = TEAMS.map(t => `<option value="${t.abbr}" ${t.abbr === m[side].abbr ? "selected" : ""}>${t.abbr} – ${t.name}</option>`).join("");
      if (!TEAMS.some(t => t.abbr === m[side].abbr)) sel.insertAdjacentHTML("afterbegin", `<option selected>${m[side].abbr}</option>`);
      sel.addEventListener("change", () => { m[side] = teamFromList(sel.value); save(); render(); });
    });
    box.appendChild(el);
  });
}

const DEFAULT_MATCHES = [{"h": "FCB", "a": "BVB"}, {"h": "RBL", "a": "B04"}, {"h": "SGE", "a": "VFB"}, {"h": "SCF", "a": "TSG"}, {"h": "BMG", "a": "WOB"}, {"h": "SVW", "a": "M05"}, {"h": "FCA", "a": "FCU"}, {"h": "FCH", "a": "STP"}, {"h": "KOE", "a": "HSV"}];

function defaultMatches() {
  const l = TEAMS.slice(0, 18);
  return Array.from({ length: 9 }, (_, i) => ({ h: teamFromList(l[i * 2].abbr), a: teamFromList(l[i * 2 + 1].abbr), t: "" }));
}

async function loadDay(n) {
  const hint = $("hint");
  hint.className = "hint"; hint.textContent = "Lade Spieltag …";
  try {
    if (!n) {
      const g = await (await fetch("https://api.openligadb.de/getcurrentgroup/bl1")).json();
      n = g.groupOrderID;
    }
    const data = await (await fetch(`https://api.openligadb.de/getmatchdata/bl1/${state.season}/${n}`)).json();
    if (!Array.isArray(data) || !data.length) throw new Error("keine Daten");
    data.sort((x, y) => new Date(x.matchDateTime) - new Date(y.matchDateTime));
    state.day = n;
    state.matches = data.map(d => ({ h: teamFromApi(d.team1.teamName, d.team1.teamIconUrl), a: teamFromApi(d.team2.teamName, d.team2.teamIconUrl), t: d.matchDateTime }));
    save(); render();
    hint.textContent = "Tipps eintragen, dann „Screenshot-Ansicht“ klicken und Bildschirmfoto machen (Mac: Cmd+Shift+4).";
  } catch (e) {
    hint.className = "hint err";
    hint.textContent = "Spieltag konnte nicht geladen werden (" + e.message + "). Paarungen bitte über „Paarungen ändern“ wählen.";
    if (!state.matches.length) { state.matches = defaultMatches(); render(); }
  }
}

$("dayIn").addEventListener("change", e => { const n = parseInt(e.target.value, 10); if (n >= 1 && n <= 34) { state.day = n; save(); render(); } });
$("loadBtn").onclick = () => loadDay(parseInt($("dayIn").value, 10) || null);
$("editBtn").onclick = () => document.body.classList.toggle("edit");
$("clearBtn").onclick = () => { if (confirm("Alle Tipps dieses Spieltags löschen?")) { state.tips[dayKey()] = {}; save(); render(); } };
$("shotBtn").onclick = () => {
  document.body.classList.remove("edit");
  document.body.classList.add("shot");
  const b = document.createElement("button");
  b.textContent = "Zurück"; b.style.cssText = "position:fixed;top:8px;right:8px;padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;opacity:.6";
  b.onclick = () => { document.body.classList.remove("shot"); b.remove(); };
  document.body.appendChild(b);
};

render();
if (!state.matches.length) loadDay(); 
</script>
